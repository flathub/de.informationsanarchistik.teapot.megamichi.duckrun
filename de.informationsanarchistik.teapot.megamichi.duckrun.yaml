app-id: de.informationsanarchistik.teapot.megamichi.duckrun
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: godot-runner

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=x11
  - --socket=pulseaudio

modules:
  - name: python3-scons
    buildsystem: simple
    build-commands:
      - pip3 install
          --no-deps
          --no-build-isolation
          --no-index
          --find-links=.
          --prefix=/app
          scons
      - scons --version
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/ce/bf/931fb9fbb87234c32b8b1b1c15fba23472a10777c12043336675633809a7/scons-4.10.1-py3-none-any.whl
        sha256: bd9d1c52f908d874eba92a8c0c0a8dcf2ed9f3b88ab956d0fce1da479c4e7126

  - name: godot
    buildsystem: simple
    build-commands:
      - scons platform=linuxbsd target=template_release tools=yes precision=single
        module_mono=no optimize=speed production=yes
      - install -Dm755 bin/godot.linuxbsd.template_release.x86_64 /app/bin/godot-runner

  - name: godot
    buildsystem: simple
    build-commands:
      - scons platform=linuxbsd target=template_release tools=yes precision=single
        module_mono=no optimize=speed production=yes
      - install -Dm755 bin/godot.linuxbsd.template_release.* /app/bin/godot-runner

    sources:
      - type: git
        url: https://github.com/godotengine/godot.git
        tag: 4.5.1-stable
        commit: f62fdbde15035c5576dad93e586201f4d41ef0cb

  - name: duckrun
    buildsystem: simple
    sources:
      - type: file
        url: https://teapot.informationsanarchistik.de/Megamichi/DuckRun/releases/download/3.1.1/DuckRun_v3.1.1.pck
        sha256: 3438b0e9bfbe833989495c7598e804c6b018c3b54c031a38f0c6190b7c592ccd

      - type: file
        path: de.informationsanarchistik.teapot.megamichi.duckrun.metainfo.xml

      - type: file
        path: de.informationsanarchistik.teapot.megamichi.duckrun.desktop

      - type: file
        path: icon.svg

    build-commands:
      - install -Dm644 DuckRun_v3.1.1.pck /app/bin/godot-runner.pck
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
